# Configuration for syncing repositories and open work items into the
# Compliance Automation planning GitHub Project board.
#
# Consumed by scripts/sync-project-board.py and
# .github/workflows/sync_project_board.yml

project:
  owner: complytime
  number: 14
  # Status option applied to newly added items (must match a Status field option)
  default_status: "Backlog"
  # When an item in Ready for Review gets a non-author comment or a submitted
  # PR review, move it to In Review. Values are prefixes of Status options
  # (board names include emojis: "Ready for Review  👀", "In Review 🏁").
  ready_for_review_status: "Ready for Review"
  in_review_status: "In Review"
  # Organization is set automatically from the source GitHub org (see
  # OWNER_TO_ORGANIZATION in scripts/sync-project-board.py). Options must
  # match the project Organization field: Agentic-SSDLC, complytime, unbound-force.

# What to sync onto the board
sync:
  issues: true
  pull_requests: true
  # Skip archived repositories unless explicitly listed under include_archived
  skip_archived: true
  # Link same-org repos to the project (enables native Project automations).
  # Cross-org repos are skipped for linking — GitHub only allows same-owner links —
  # but their issues/PRs are still added to the board.
  link_repositories: true

# Organizations and repository selection rules
organizations:
  - name: Agentic-SSDLC
    # All repositories

  - name: complytime
    exclude_repos:
      - roadmap
      - complytime

  - name: unbound-force
    # All repositories
