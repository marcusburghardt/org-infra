# SPDX-License-Identifier: Apache-2.0
#
# Validates the reusable vulnerability scan's static integration contract.
# The focused test prevents complete OSV reports from returning to job outputs.

name: Test Vulnerability Scan Workflow

on:
  pull_request:
    paths:
      - ".github/workflows/ci_test_vuln_scan.yml"
      - ".github/workflows/reusable_vuln_scan.yml"
      - "tests/test_vuln_scan_workflow.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci_test_vuln_scan.yml"
      - ".github/workflows/reusable_vuln_scan.yml"
      - "tests/test_vuln_scan_workflow.py"

permissions:
  contents: read

jobs:
  test-vulnerability-scan-workflow:
    name: Test Vulnerability Scan Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run vulnerability scan workflow regression tests
        run: python -m pytest tests/test_vuln_scan_workflow.py -v
