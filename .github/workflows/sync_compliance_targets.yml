---
# --------------------------------------------------------------------------
# Sync Compliance Targets
#
# Compares the repository inventory in peribolos.yaml (from the org's
# .github repository) against the compliance scan targets in
# .complytime/complytime.yaml. When drift is detected (repos added or
# removed), opens a PR to update the target list.
#
# This is an org-infra-only workflow. It is NOT synced to other repos.
# --------------------------------------------------------------------------
name: Sync Compliance Targets

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: none

jobs:
  sync-targets:
    name: Sync Compliance Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    env:
      SYNC_BRANCH: sync/compliance-targets

    steps:
      - name: Checkout org-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Clone .github repository for peribolos.yaml
        # complytime/.github is a public repository; no auth needed.
        run: |
          git clone --depth 1 https://github.com/complytime/.github.git /tmp/dotgithub

      - name: Validate peribolos.yaml exists
        run: |
          if [ ! -f /tmp/dotgithub/peribolos.yaml ]; then
            echo "::error::peribolos.yaml not found in complytime/.github"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet PyYAML==6.0.3

      - name: Run sync-compliance-targets
        id: sync
        run: |
          set +e
          python scripts/sync-compliance-targets.py \
            --peribolos /tmp/dotgithub/peribolos.yaml \
            --complytime .complytime/complytime.yaml \
            --org complytime \
            --output /tmp/complytime-updated.yaml \
            --exclude ".github,complyscribe"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

          if [ "${exit_code}" -eq 1 ]; then
            echo "::error::Sync script encountered an error"
            exit 1
          fi
          exit 0

      - name: Copy updated config
        if: steps.sync.outputs.exit_code == '2'
        run: |
          cp /tmp/complytime-updated.yaml .complytime/complytime.yaml

      - name: Create branch and commit
        if: steps.sync.outputs.exit_code == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${SYNC_BRANCH}"
          git add .complytime/complytime.yaml
          git commit -s -m "chore: sync compliance targets with peribolos

          Automated update to keep .complytime/complytime.yaml aligned
          with the repository inventory in peribolos.yaml."
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Create or update PR
        if: steps.sync.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list \
            --head "${SYNC_BRANCH}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${existing_pr}" ]; then
            echo "PR #${existing_pr} already exists — updated by push"
          else
            gh pr create \
              --title "chore: sync compliance targets with peribolos" \
              --body "Automated PR to update compliance scan targets.

          The repository inventory in \`peribolos.yaml\` has changed.
          This PR updates \`.complytime/complytime.yaml\` to match.

          Review the target list and merge when ready." \
              --head "${SYNC_BRANCH}" \
              --base main
          fi
